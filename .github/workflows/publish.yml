name: Publish to NuGet

# ============================================================================
# 使用 NuGet Trusted Publishing（OIDC）向 nuget.org 发布包。
#
# 复用 ofdrwnet 已验证可用的方式：用官方 NuGet/login@v1 Action 向 GitHub 申请
# OIDC 身份令牌，再向 nuget.org 换取一张有效期约 1 小时的一次性临时 API Key，
# 传给 dotnet nuget push。全程无需长期 API Key。
#
# 启用前需在 nuget.org 配置一次（Account → Trusted Publishing → Add policy）：
#   Repository Owner : sdhzth
#   Repository       : ElementPlus-Blazor
#   Workflow File    : publish.yml        ← 只填文件名，不带 .github/workflows/ 路径
# 并在本仓库 Settings → Secrets and variables → Actions → Variables
#   新增变量 NUGET_USER = 你的 nuget.org 用户名（profile name，不是邮箱，如 sdhzsmart）
#
# 触发方式：推送形如 v0.12.0 的 tag，或手动 workflow_dispatch。
# ============================================================================

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # 申请 OIDC 身份令牌（发布必需）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check NUGET_USER
        shell: bash
        run: |
          if [ -z "${{ vars.NUGET_USER }}" ]; then
            echo "✘ 仓库变量 NUGET_USER 未设置。"
            echo "  设置位置: Settings → Secrets and variables → Actions → Variables"
            echo "  取值: 你的 nuget.org 用户名（profile name，不是登录邮箱，如 sdhzsmart）"
            exit 1
          fi
          echo "NUGET_USER = ${{ vars.NUGET_USER }}"

      - name: Restore
        run: dotnet restore ElementPlus-Blazor.slnx

      # RCL 含静态资源，需先 build 生成 obj/Release/net10.0/staticwebassets.build.json，
      # 再用 --no-build 打包，否则 dotnet pack 直接打会报 "Manifest file ... not found"。
      - name: Build (generate static web asset manifest)
        run: |
          dotnet build src/Components/Element.csproj -c Release
          dotnet build src/X/Element.X.csproj -c Release
          dotnet build src/Markdown/Element.Markdown.csproj -c Release

      - name: Pack
        run: |
          dotnet pack src/Components/Element.csproj -c Release --no-build -o ./artifacts
          dotnet pack src/X/Element.X.csproj -c Release --no-build -o ./artifacts
          dotnet pack src/Markdown/Element.Markdown.csproj -c Release --no-build -o ./artifacts

      # 临时 API Key 有效期约 1 小时 —— 紧贴推送步骤获取
      - name: NuGet login (OIDC → 临时 API Key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          dotnet nuget push "./artifacts/*.snupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
