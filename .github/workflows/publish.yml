name: Publish to NuGet

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for NuGet.org trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ElementPlus-Blazor.slnx

      # RCL 含静态资源，需先 build 生成 obj/Release/net10.0/staticwebassets.build.json，
      # 再用 --no-build 打包，否则 dotnet pack 直接打会报 "Manifest file ... not found"。
      - name: Build (generate static web asset manifest)
        run: |
          dotnet build src/Components/Element.csproj -c Release
          dotnet build src/X/Element.X.csproj -c Release
          dotnet build src/Markdown/Element.Markdown.csproj -c Release

      - name: Pack
        run: |
          dotnet pack src/Components/Element.csproj -c Release --no-build -o ./artifacts
          dotnet pack src/X/Element.X.csproj -c Release --no-build -o ./artifacts
          dotnet pack src/Markdown/Element.Markdown.csproj -c Release --no-build -o ./artifacts

      # Publish with a NuGet API key stored as the NUGET_API_KEY repo secret.
      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          dotnet nuget push "./artifacts/*.snupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
